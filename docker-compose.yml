services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careertrack
      POSTGRES_USER: careertrack
      POSTGRES_PASSWORD: careertrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careertrack -d careertrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://careertrack:careertrack@db:5432/careertrack?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-this-local-secret
      DEMO_SEED: "true"
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy &&
      node prisma/seed.js &&
      node server.js"

volumes:
  postgres_data:
